<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
    <title>Z-Movies</title>
    <style>
      :root {
        --sat: env(safe-area-inset-top, 0px);
        --sab: env(safe-area-inset-bottom, 0px);
        --sal: env(safe-area-inset-left, 0px);
        --sar: env(safe-area-inset-right, 0px);
        --accent: #ff2a44;
      }

      /* Hide desktop window controls and title bar */
      .traffic-lights,
      .traffic-lights *,
      .tl,
      .title-strip,
      .title-strip-drag,
      .login-chrome,
      .who-chrome,
      [aria-label="Contrôles fenêtre"] {
        display: none !important;
        visibility: hidden !important;
        height: 0 !important;
        min-height: 0 !important;
        padding: 0 !important;
        margin: 0 !important;
        pointer-events: none !important;
      }

      /* ============================================================
         APPLE LIQUID GLASS MOBILE LAYOUT & SYSTEM
         ============================================================ */
      @media (max-width: 900px), (pointer: coarse) {
        html,
        body {
          width: 100vw !important;
          height: 100% !important;
          margin: 0 !important;
          padding: 0 !important;
          overflow-x: hidden !important;
          overflow-y: auto !important;
          -webkit-overflow-scrolling: touch !important;
          position: relative !important;
          background: #000000 !important;
        }

        #root,
        .app {
          width: 100vw !important;
          min-height: 100% !important;
          height: auto !important;
          overflow: visible !important;
          display: flex !important;
          flex-direction: column !important;
        }

        /* Eliminate desktop sidebar completely on mobile */
        .rail-slot,
        aside.rail {
          display: none !important;
          width: 0 !important;
          min-width: 0 !important;
          max-width: 0 !important;
          flex: 0 0 0 !important;
          overflow: hidden !important;
          pointer-events: none !important;
        }

        .layout {
          flex: 1 0 auto !important;
          display: block !important;
          width: 100vw !important;
          max-width: 100vw !important;
          overflow: visible !important;
          padding: 0 !important;
          margin: 0 !important;
        }

        main.stage,
        .stage {
          width: 100vw !important;
          max-width: 100vw !important;
          min-height: 100vh !important;
          height: auto !important;
          margin: 0 !important;
          padding: calc(env(safe-area-inset-top, 16px) + 54px) 16px calc(env(safe-area-inset-bottom, 16px) + 115px) 16px !important;
          overflow-x: hidden !important;
          overflow-y: visible !important;
          box-sizing: border-box !important;
          touch-action: pan-y !important;
        }

        /* Full bleed hero banner */
        .anime-hero,
        .hero {
          width: calc(100% + 32px) !important;
          margin-left: -16px !important;
          margin-right: -16px !important;
          margin-top: calc(-1 * (env(safe-area-inset-top, 16px) + 54px)) !important;
          height: 52vh !important;
          min-height: 390px !important;
          background-size: cover !important;
          background-position: center 20% !important;
          position: relative !important;
          padding-top: calc(env(safe-area-inset-top, 16px) + 60px) !important;
        }

        .anime-hero::after,
        .hero::after {
          content: "" !important;
          position: absolute !important;
          inset: 0 !important;
          background: linear-gradient(
            180deg,
            rgba(0, 0, 0, 0.25) 0%,
            transparent 35%,
            rgba(0, 0, 0, 0.75) 75%,
            #000000 100%
          ) !important;
          pointer-events: none !important;
        }

        /* Hide desktop-only arrows and hero progress bar */
        .section-arrows,
        .section-arrows *,
        .anime-hero-progress,
        .hero-progress {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
          visibility: hidden !important;
          pointer-events: none !important;
        }

        /* Liquid Glass CTA Buttons */
        .hero-btn-play,
        .btn.cta {
          background: linear-gradient(135deg, #ff2a44 0%, #d90429 100%) !important;
          border: 0.5px solid rgba(255, 255, 255, 0.35) !important;
          box-shadow: 0 8px 24px rgba(255, 42, 68, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.45) !important;
          border-radius: 999px !important;
          padding: 12px 24px !important;
          font-weight: 700 !important;
        }

        .hero-btn-list,
        .btn.ghost {
          background: rgba(255, 255, 255, 0.14) !important;
          border: 0.5px solid rgba(255, 255, 255, 0.25) !important;
          border-radius: 999px !important;
          padding: 12px 20px !important;
          color: #ffffff !important;
          backdrop-filter: blur(25px) saturate(200%) !important;
          -webkit-backdrop-filter: blur(25px) saturate(200%) !important;
          box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.35) !important;
        }

        /* Smooth card carousel on iOS - Allow vertical scrolling through cards */
        .cards-track,
        .catalog-row,
        .magazine-track,
        .trend-track {
          display: flex !important;
          overflow-x: auto !important;
          overflow-y: visible !important;
          -webkit-overflow-scrolling: touch !important;
          touch-action: pan-x pan-y !important;
          scroll-snap-type: x proximity !important;
          gap: 12px !important;
          padding: 8px 16px 20px 16px !important;
          margin-left: -16px !important;
          margin-right: -16px !important;
          scrollbar-width: none !important;
        }
        .cards-track::-webkit-scrollbar,
        .magazine-track::-webkit-scrollbar,
        .trend-track::-webkit-scrollbar {
          display: none !important;
        }

        .title-card,
        .anime-card,
        .trend-card,
        .mag-card,
        .card {
          flex: 0 0 135px !important;
          width: 135px !important;
          border-radius: 16px !important;
          overflow: hidden !important;
          box-shadow: 0 8px 24px rgba(0, 0, 0, 0.55) !important;
          touch-action: pan-y !important;
          user-select: none !important;
          -webkit-user-select: none !important;
        }

        .magazine-track.dragging,
        .trend-track.dragging {
          touch-action: pan-x pan-y !important;
        }

        .rail-head {
          display: flex !important;
          align-items: center !important;
          justify-content: space-between !important;
          margin: 18px 0 10px 0 !important;
          padding: 0 2px !important;
        }

        .section-kicker {
          font-size: 11px !important;
          font-weight: 700 !important;
          letter-spacing: 0.1em !important;
          margin-right: 8px !important;
        }

        .catalog-grid {
          display: grid !important;
          grid-template-columns: repeat(2, 1fr) !important;
          gap: 14px !important;
          padding-bottom: 120px !important;
        }

        .catalog-grid .mag-card,
        .catalog-grid .film-card,
        .catalog-grid .title-card {
          width: 100% !important;
          min-width: 0 !important;
          max-width: 100% !important;
          flex: 1 1 100% !important;
        }

        /* Movie and Anime Fiche on Mobile */
        .fiche,
        .film-fiche {
          padding-bottom: 120px !important;
        }
      }

      /* ============================================================
         AUTHENTIC APPLE LIQUID GLASS TOP HEADER
         ============================================================ */
      .ios-glass-header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: calc(52px + env(safe-area-inset-top, 14px));
        padding: env(safe-area-inset-top, 14px) 16px 0 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(12, 12, 18, 0.45);
        -webkit-backdrop-filter: blur(40px) saturate(210%) brightness(110%);
        backdrop-filter: blur(40px) saturate(210%) brightness(110%);
        border-bottom: 0.5px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45), inset 0 -0.5px 0 rgba(255, 255, 255, 0.08);
        z-index: 9998;
        box-sizing: border-box;
      }

      .ios-glass-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .ios-glass-brand img {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        object-fit: cover;
        box-shadow: 0 2px 10px rgba(255, 42, 68, 0.4);
      }
      .ios-glass-title {
        font-family: 'Syne', 'Inter', -apple-system, sans-serif;
        font-size: 16px;
        font-weight: 800;
        letter-spacing: -0.02em;
        color: #ffffff;
      }
      .ios-glass-pill {
        font-size: 9px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        padding: 2px 7px;
        border-radius: 999px;
        background: rgba(255, 42, 68, 0.22);
        border: 0.5px solid rgba(255, 42, 68, 0.5);
        color: #ff6b8b;
      }

      .ios-glass-actions {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .ios-glass-action-btn {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.12);
        border: 0.5px solid rgba(255, 255, 255, 0.22);
        display: flex;
        align-items: center;
        justify-content: center;
        color: #ffffff;
        cursor: pointer;
        padding: 0;
        box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35);
        transition: transform 0.15s ease;
      }
      .ios-glass-action-btn:active {
        transform: scale(0.92);
      }
      .ios-glass-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 42, 68, 0.7);
        object-fit: cover;
      }

      /* ============================================================
         AUTHENTIC APPLE LIQUID GLASS FLOATING BOTTOM DOCK
         ============================================================ */
      .ios-liquid-dock {
        position: fixed;
        bottom: calc(env(safe-area-inset-bottom, 12px) + 8px);
        left: 50%;
        transform: translateX(-50%);
        width: min(390px, calc(100vw - 28px));
        height: 64px;
        background: rgba(20, 20, 28, 0.45);
        -webkit-backdrop-filter: blur(45px) saturate(220%) brightness(115%);
        backdrop-filter: blur(45px) saturate(220%) brightness(115%);
        border: 0.5px solid rgba(255, 255, 255, 0.22);
        border-radius: 36px;
        box-shadow:
          0 24px 50px -8px rgba(0, 0, 0, 0.7),
          inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.45),
          inset 0 0 0 0.5px rgba(255, 255, 255, 0.08),
          inset 0 -1px 1px 0 rgba(0, 0, 0, 0.4);
        display: flex;
        align-items: center;
        justify-content: space-around;
        padding: 0 8px;
        z-index: 9999;
        box-sizing: border-box;
      }

      .ios-dock-btn {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 3px;
        height: 52px;
        border-radius: 20px;
        color: rgba(255, 255, 255, 0.45);
        background: transparent;
        border: none;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: -0.01em;
        transition: all 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        padding: 0;
      }
      .ios-dock-btn:active {
        transform: scale(0.92);
      }
      .ios-dock-btn svg {
        width: 22px;
        height: 22px;
        stroke: currentColor;
        stroke-width: 2;
        fill: none;
        transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1), stroke 0.2s ease, filter 0.2s ease;
      }

      .ios-dock-btn.active {
        color: #ffffff;
        background: transparent;
        box-shadow: none;
      }
      .ios-dock-btn.active svg {
        stroke: #ff2a44;
        filter: drop-shadow(0 0 8px rgba(255, 42, 68, 0.7));
        transform: scale(1.12);
      }
      .ios-dock-btn.active span {
        color: #ffffff;
        font-weight: 700;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      }

      /* Hide floating UI during video playback and on LoginGate */
      body.is-watching .ios-liquid-dock,
      body.is-watching .ios-glass-header,
      body.has-login-gate .ios-liquid-dock,
      body.has-login-gate .ios-glass-header {
        display: none !important;
      }

      /* ============================================================
         AUTHENTIC APPLE LIQUID GLASS LOGIN GATE & PROFILE PICKER
         ============================================================ */
      .login-gate,
      .who-page {
        position: fixed !important;
        inset: 0 !important;
        width: 100vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        min-height: 100vh !important;
        min-height: 100dvh !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        padding: calc(env(safe-area-inset-top, 24px) + 20px) 20px calc(env(safe-area-inset-bottom, 20px) + 24px) 20px !important;
        box-sizing: border-box !important;
        background: radial-gradient(ellipse 90% 65% at 50% 30%, rgba(255, 42, 68, 0.2), transparent 70%), #000000 !important;
        z-index: 10000 !important;
        overflow-y: auto !important;
        -webkit-overflow-scrolling: touch !important;
      }

      .login-card {
        width: 100% !important;
        max-width: 360px !important;
        margin: auto !important;
        background: rgba(22, 20, 30, 0.65) !important;
        -webkit-backdrop-filter: blur(50px) saturate(220%) !important;
        backdrop-filter: blur(50px) saturate(220%) !important;
        border: 0.5px solid rgba(255, 255, 255, 0.22) !important;
        border-radius: 36px !important;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.85), inset 0 1px 1.5px 0 rgba(255, 255, 255, 0.45) !important;
        padding: 36px 24px 28px 24px !important;
        box-sizing: border-box !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        text-align: center !important;
      }

      .login-actions {
        width: 100% !important;
        display: flex !important;
        flex-direction: column !important;
        gap: 12px !important;
        margin-top: 24px !important;
      }

      .login-actions .btn,
      .login-actions button {
        width: 100% !important;
        border-radius: 999px !important;
        padding: 14px 20px !important;
        font-weight: 700 !important;
        font-size: 14.5px !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 10px !important;
        box-sizing: border-box !important;
        transition: transform 0.15s ease !important;
        cursor: pointer !important;
      }
      .login-actions .btn:active,
      .login-actions button:active {
        transform: scale(0.97) !important;
      }

      /* First button: Discord */
      .login-actions .btn.cta,
      .login-actions > button:nth-of-type(1),
      .login-actions > div > button:nth-of-type(1) {
        background: #5865F2 !important;
        color: #ffffff !important;
        border: 0.5px solid rgba(255, 255, 255, 0.3) !important;
        box-shadow: 0 8px 25px rgba(88, 101, 242, 0.45), inset 0 1px 1px rgba(255, 255, 255, 0.4) !important;
      }

      /* Second button: Google */
      .login-actions .btn:not(.cta),
      .login-actions > button:nth-of-type(2),
      .login-actions > div > button:nth-of-type(2) {
        background: #ffffff !important;
        border: 1px solid rgba(0, 0, 0, 0.08) !important;
        color: #1a1a1a !important;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25) !important;
      }

      /* Third button: Invité */
      .login-guest-trigger {
        margin-top: 8px !important;
        background: rgba(255, 255, 255, 0.08) !important;
        border: 0.5px solid rgba(255, 255, 255, 0.18) !important;
        border-radius: 999px !important;
        padding: 12px 18px !important;
        color: rgba(255, 255, 255, 0.85) !important;
        font-size: 13px !important;
        font-weight: 600 !important;
        cursor: pointer !important;
        backdrop-filter: blur(14px) !important;
        -webkit-backdrop-filter: blur(14px) !important;
        width: 100% !important;
        box-sizing: border-box !important;
        transition: transform 0.15s ease !important;
      }
      .login-guest-trigger:active {
        transform: scale(0.97) !important;
      }
    </style>
    <script>
      window.isTauri = true;

      try {
        var prevSession = localStorage.getItem('zflix.auth.session');
        if (prevSession && prevSession.includes('ios_guest_token')) {
          localStorage.removeItem('zflix.auth.session');
          localStorage.removeItem('zflix.watch.active');
        }
      } catch (e) {}

      // ── Process incoming OAuth token & user from callback redirect ──
      (function checkOAuthCallback() {
        try {
          var qs = window.location.search || (window.location.hash ? window.location.hash.slice(1) : '');
          if (!qs) return;
          var p = new URLSearchParams(qs);
          var token = p.get('token');
          var userRaw = p.get('user');
          if (token && userRaw) {
            var u = JSON.parse(decodeURIComponent(userRaw));
            var session = {
              token: token,
              user: {
                id: String(u.id || 'u_' + Date.now()),
                username: u.username || u.name || 'Membre Z-Flix',
                avatar: u.avatar ? (u.avatar.startsWith('http') ? u.avatar : 'https://cdn.discordapp.com/avatars/' + u.id + '/' + u.avatar + '.png?size=128') : (u.picture || null),
                discordId: u.id || null,
                googleId: u.google_id || null
              }
            };
            var profile = {
              id: 'account_' + session.user.id,
              name: session.user.username,
              avatarUrl: session.user.avatar || './icon.png',
              isAccount: true,
              createdAt: Date.now()
            };
            localStorage.setItem('zflix.auth.session', JSON.stringify(session));
            localStorage.setItem('zflix.watch.profiles', JSON.stringify([profile]));
            localStorage.setItem('zflix.watch.active', profile.id);
            if (window.history && window.history.replaceState) {
              window.history.replaceState({}, document.title, window.location.pathname);
            }
          }
        } catch (err) {
          console.error('[OAuth Callback Error]', err);
        }
      })();

      // ── Tauri Bridge Mock for iOS Capacitor WKWebView ──
      var eventListeners = {};
      function emitTauriEvent(eventName, payload) {
        var list = eventListeners[eventName] || [];
        list.forEach(function(fnId) {
          if (typeof window['_' + fnId] === 'function') {
            try {
              window['_' + fnId]({ event: eventName, payload: payload });
            } catch (err) {
              console.error(err);
            }
          }
        });
      }

      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: 'main' },
          currentWebview: { label: 'main' }
        },
        transformCallback: function(callback, once) {
          var id = Math.floor(Math.random() * 1000000);
          window['_' + id] = function(res) {
            try { callback(res); } catch (e) { console.error(e); }
            if (once) delete window['_' + id];
          };
          return id;
        },
        invoke: async function(cmd, args) {
          console.log('[Tauri Bridge]', cmd, args);
          if (cmd === 'start_media_proxy') return 0;
          if (cmd === 'plugin:event|listen') {
            var evt = args && args.event;
            var handlerId = args && args.handler;
            if (evt && handlerId) {
              eventListeners[evt] = eventListeners[evt] || [];
              eventListeners[evt].push(handlerId);
            }
            return 1;
          }
          if (cmd === 'plugin:event|unlisten') return;
          if (cmd === 'get_auth_session') {
            try {
              var s = localStorage.getItem('zflix.auth.session');
              if (s) return JSON.parse(s);
            } catch (e) {}
            return null;
          }
          if (cmd === 'start_oauth') {
            var provider = (args && args.provider) || 'discord';
            if (provider === 'google') {
              var customName = prompt('Entrez votre prénom ou pseudo pour le compte Google :', 'Ares');
              if (!customName || !customName.trim()) customName = 'Ares';
              var googleSess = {
                token: 'ios_google_' + Date.now(),
                user: {
                  id: 'google_' + Date.now(),
                  username: customName.trim(),
                  avatar: 'https://cdn.discordapp.com/embed/avatars/2.png',
                  discordId: null,
                  googleId: 'g_' + Date.now()
                }
              };
              var googleProf = {
                id: 'account_' + googleSess.user.id,
                name: googleSess.user.username,
                avatarUrl: googleSess.user.avatar,
                isAccount: true,
                createdAt: Date.now()
              };
              localStorage.setItem('zflix.auth.session', JSON.stringify(googleSess));
              localStorage.setItem('zflix.watch.profiles', JSON.stringify([googleProf]));
              localStorage.setItem('zflix.watch.active', googleProf.id);
              emitTauriEvent('auth-session', googleSess);
              window.location.reload();
              return null;
            }

            var returnTo = 'http://localhost/';
            var authUrl = 'https://streaming-api.cardz.workers.dev/auth/' + provider + '?return_to=' + encodeURIComponent(returnTo);
            // Navigate directly inside app WKWebView
            window.location.href = authUrl;
            return null;
          }
          if (cmd === 'logout_auth') {
            try {
              localStorage.removeItem('zflix.auth.session');
              localStorage.removeItem('zflix.watch.active');
            } catch (e) {}
            emitTauriEvent('auth-session', null);
            return;
          }
          if (cmd === 'plugin:opener|open_url') {
            if (args && args.url) window.open(args.url, '_blank');
            return;
          }
          if (cmd === 'open') {
            if (args && args.path) window.open(args.path, '_blank');
            return;
          }
          if (cmd.startsWith('plugin:window|') || cmd.startsWith('plugin:webview|')) {
            return true;
          }
          if (cmd === 'fetch_text' || cmd === 'fetch_text_insecure') {
            try {
              var headers = {};
              if (args && args.referer) headers['Referer'] = args.referer;
              var res = await fetch(args.url, { headers: headers });
              return await res.text();
            } catch (e) {
              console.warn('fetch_text error:', e);
              return null;
            }
          }
          if (cmd === 'fetch_post_form') {
            try {
              var res = await fetch(args.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: args.body
              });
              return await res.text();
            } catch (e) {
              console.warn('fetch_post_form error:', e);
              return null;
            }
          }
          return null;
        }
      };

      // ── Initialize Mobile Apple Liquid Glass UI ──
      window.addEventListener('DOMContentLoaded', function() {
        // Append top header
