    <title>Z-Animes</title>
    <script>
      window.isTauri = true;
      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: 'main' },
          currentWebview: { label: 'main' }
        },
        transformCallback: function(callback, once) {
          var id = Math.floor(Math.random() * 1000000);
          window['_' + id] = function(res) {
            try { callback(res); } catch (e) { console.error(e); }
            if (once) delete window['_' + id];
          };
          return id;
        },
        invoke: async function(cmd, args) {
          console.log('[Tauri Bridge]', cmd, args);
          if (cmd === 'start_media_proxy') return 0;
          if (cmd === 'plugin:event|listen') return 1;
          if (cmd === 'plugin:event|unlisten') return;
          if (cmd === 'plugin:window|is_maximized') return true;
          if (cmd === 'plugin:window|on_resized') return 1;
          if (cmd === 'logout_auth') {
            try { localStorage.clear(); } catch(e){}
            return;
          }
          if (cmd === 'fetch_text' || cmd === 'fetch_text_insecure') {
            try {
              var headers = {};
              if (args && args.referer) headers['Referer'] = args.referer;
              var res = await fetch(args.url, { headers: headers });
              return await res.text();
            } catch (e) {
              console.warn('fetch_text error:', e);
              return null;
            }
          }
          if (cmd === 'fetch_post_form') {
            try {
              var res = await fetch(args.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: args.body
              });
              return await res.text();
            } catch (e) {
              console.warn('fetch_post_form error:', e);
              return null;
            }
          }
          return null;
        }
      };
      window.addEventListener('error', function(e) {
        console.error('App Error:', e.error || e.message);
      });
    </script>
