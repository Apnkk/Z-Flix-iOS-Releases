<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="./icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
    <title>Z-Animes</title>
    <script>
      window.isTauri = true;

      var DEFAULT_USER = {
        id: 'ares_ios',
        username: 'Ares',
        avatar: 'https://cdn.discordapp.com/embed/avatars/0.png',
        discordId: 'ares',
        googleId: null
      };
      var DEFAULT_SESSION = {
        token: 'ios_guest_token',
        user: DEFAULT_USER
      };
      var DEFAULT_PROFILE = {
        id: 'account_ares_ios',
        name: 'Ares',
        avatarUrl: 'https://cdn.discordapp.com/embed/avatars/0.png',
        isAccount: true,
        createdAt: Date.now()
      };

      try {
        var existingSession = localStorage.getItem('zflix.auth.session');
        if (!existingSession || existingSession === 'null') {
          localStorage.setItem('zflix.auth.session', JSON.stringify(DEFAULT_SESSION));
        }
        var existingProfiles = localStorage.getItem('zflix.watch.profiles');
        if (!existingProfiles || existingProfiles === 'null' || existingProfiles === '[]') {
          localStorage.setItem('zflix.watch.profiles', JSON.stringify([DEFAULT_PROFILE]));
        }
        var existingActive = localStorage.getItem('zflix.watch.active');
        if (!existingActive || existingActive === 'null') {
          localStorage.setItem('zflix.watch.active', DEFAULT_PROFILE.id);
        }
      } catch (e) {
        console.warn('Init storage error:', e);
      }

      var eventListeners = {};
      function emitTauriEvent(eventName, payload) {
        var list = eventListeners[eventName] || [];
        list.forEach(function(fnId) {
          if (typeof window['_' + fnId] === 'function') {
            try {
              window['_' + fnId]({ event: eventName, payload: payload });
            } catch (err) {
              console.error(err);
            }
          }
        });
      }

      window.__TAURI_INTERNALS__ = {
        metadata: {
          currentWindow: { label: 'main' },
          currentWebview: { label: 'main' }
        },
        transformCallback: function(callback, once) {
          var id = Math.floor(Math.random() * 1000000);
          window['_' + id] = function(res) {
            try { callback(res); } catch (e) { console.error(e); }
            if (once) delete window['_' + id];
          };
          return id;
        },
        invoke: async function(cmd, args) {
          console.log('[Tauri Bridge]', cmd, args);
          if (cmd === 'start_media_proxy') return 0;
          if (cmd === 'plugin:event|listen') {
            var evt = args && args.event;
            var handlerId = args && args.handler;
            if (evt && handlerId) {
              eventListeners[evt] = eventListeners[evt] || [];
              eventListeners[evt].push(handlerId);
            }
            return 1;
          }
          if (cmd === 'plugin:event|unlisten') return;
          if (cmd === 'get_auth_session') {
            try {
              var s = localStorage.getItem('zflix.auth.session');
              if (s) return JSON.parse(s);
            } catch (e) {}
            return DEFAULT_SESSION;
          }
          if (cmd === 'start_oauth') {
            var provider = (args && args.provider) || 'discord';
            var provLabel = provider === 'google' ? 'Google' : 'Discord';
            var sess = {
              token: 'ios_' + Date.now(),
              user: {
                id: 'ares_ios',
                username: 'Ares (' + provLabel + ')',
                avatar: 'https://cdn.discordapp.com/embed/avatars/0.png',
                discordId: provider === 'discord' ? 'ares_discord' : null,
                googleId: provider === 'google' ? 'ares_google' : null
              }
            };
            var prof = {
              id: 'account_ares_ios',
              name: 'Ares (' + provLabel + ')',
              avatarUrl: 'https://cdn.discordapp.com/embed/avatars/0.png',
              isAccount: true,
              createdAt: Date.now()
            };
            try {
              localStorage.setItem('zflix.auth.session', JSON.stringify(sess));
              localStorage.setItem('zflix.watch.profiles', JSON.stringify([prof]));
              localStorage.setItem('zflix.watch.active', prof.id);
            } catch (e) {}
            emitTauriEvent('auth-session', sess);
            setTimeout(function() {
              window.location.reload();
            }, 50);
            return null;
          }
          if (cmd === 'logout_auth') {
            try {
              localStorage.removeItem('zflix.auth.session');
              localStorage.removeItem('zflix.watch.active');
            } catch (e) {}
            emitTauriEvent('auth-session', null);
            return;
          }
          if (cmd === 'plugin:opener|open_url') {
            if (args && args.url) window.open(args.url, '_blank');
            return;
          }
          if (cmd === 'open') {
            if (args && args.path) window.open(args.path, '_blank');
            return;
          }
          if (cmd.startsWith('plugin:window|') || cmd.startsWith('plugin:webview|')) {
            return true;
          }
          if (cmd === 'fetch_text' || cmd === 'fetch_text_insecure') {
            try {
              var headers = {};
              if (args && args.referer) headers['Referer'] = args.referer;
              var res = await fetch(args.url, { headers: headers });
              return await res.text();
            } catch (e) {
              console.warn('fetch_text error:', e);
              return null;
            }
          }
          if (cmd === 'fetch_post_form') {
            try {
              var res = await fetch(args.url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: args.body
              });
              return await res.text();
            } catch (e) {
              console.warn('fetch_post_form error:', e);
              return null;
            }
          }
          return null;
        }
      };
      window.addEventListener('error', function(e) {
        console.error('App Error:', e.error || e.message);
      });
    </script>
