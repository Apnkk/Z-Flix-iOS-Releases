name: Build Z-Flix iOS IPAs (Movies & Animes)

on:
  workflow_dispatch:
    inputs:
      movies_tag:
        description: 'Z-Movies version (e.g. v6.0.63)'
        required: true
        default: 'v6.0.63'
      animes_tag:
        description: 'Z-Animes version (e.g. v6.0.117)'
        required: true
        default: 'v6.0.117'

jobs:
  build-movies:
    name: Build Z-Movies IPA
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Releases Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone Z-FLIX-app (Movies)
        run: |
          git clone --depth 1 https://github.com/Apnkk/Z-FLIX-app.git movies_src

      - name: Build Web App
        run: |
          cd movies_src
          npm install
          npm run build

      - name: Setup Capacitor iOS
        run: |
          cd movies_src
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "Z-Movies" "com.zflix.movies" --web-dir dist
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Archive with Xcode
        run: |
          cd movies_src/ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Z-Movies.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package into IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/Z-Movies.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/Z-Movies.app"
          cd "$RUNNER_TEMP"
          zip -r9 "$GITHUB_WORKSPACE/Z-Movies.ipa" Payload

      - name: Upload Movies IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-Movies-IPA
          path: Z-Movies.ipa

      - name: Release Z-Movies IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.movies_tag }}
          name: "Z-Movies iOS ${{ github.event.inputs.movies_tag }}"
          body: |
            ### Z-Movies iOS — Liquid Glass Edition
            * Interface Liquid Glass Apple & Dark Mode AMOLED
            * Support du streaming HLS sans publicité
            * Compatible Feather, AltStore, SideStore, TrollStore
          files: Z-Movies.ipa
          token: ${{ secrets.GITHUB_TOKEN }}

  build-animes:
    name: Build Z-Animes IPA
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout Releases Repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone z-flix-anime (Animes)
        run: |
          git clone --depth 1 https://github.com/Apnkk/z-flix-anime.git animes_src

      - name: Build Web App
        run: |
          cd animes_src
          npm install
          npm run build

      - name: Setup Capacitor iOS
        run: |
          cd animes_src
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init "Z-Animes" "com.zflix.animes" --web-dir dist
          npx cap add ios
          npx cap sync ios

      - name: Build iOS Archive with Xcode
        run: |
          cd animes_src/ios/App
          xcodebuild archive \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Z-Animes.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO

      - name: Package into IPA
        run: |
          mkdir -p "$RUNNER_TEMP/Payload"
          cp -r "$RUNNER_TEMP/Z-Animes.xcarchive/Products/Applications/App.app" "$RUNNER_TEMP/Payload/Z-Animes.app"
          cd "$RUNNER_TEMP"
          zip -r9 "$GITHUB_WORKSPACE/Z-Animes.ipa" Payload

      - name: Upload Animes IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Z-Animes-IPA
          path: Z-Animes.ipa

      - name: Release Z-Animes IPA
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.animes_tag }}
          name: "Z-Animes iOS ${{ github.event.inputs.animes_tag }}"
          body: |
            ### Z-Animes iOS — Liquid Glass Edition
            * Interface Liquid Glass Apple & Dark Mode AMOLED
            * Catalogue Animes & Mangas complet sans publicité
            * Compatible Feather, AltStore, SideStore, TrollStore
          files: Z-Animes.ipa
          token: ${{ secrets.GITHUB_TOKEN }}

  update-feather:
    name: Update Feather Repository JSON
    needs: [build-movies, build-animes]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Releases Repo
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Z-Movies-IPA
          path: ./movies-artifact

      - uses: actions/download-artifact@v4
        with:
          name: Z-Animes-IPA
          path: ./animes-artifact

      - name: Update feather.json with exact sizes
        run: |
          MOVIES_SIZE=$(stat -c%s ./movies-artifact/Z-Movies.ipa 2>/dev/null || echo 25000000)
          ANIMES_SIZE=$(stat -c%s ./animes-artifact/Z-Animes.ipa 2>/dev/null || echo 25000000)
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          MOVIES_TAG="${{ github.event.inputs.movies_tag }}"
          ANIMES_TAG="${{ github.event.inputs.animes_tag }}"
          MOVIES_VER="${MOVIES_TAG#v}"
          ANIMES_VER="${ANIMES_TAG#v}"

          python3 -c "
          import json

          with open('feather.json', 'r') as f:
              data = json.load(f)

          for app in data.get('apps', []):
              if app.get('name') == 'Z-Movies':
                  app['version'] = '$MOVIES_VER'
                  app['versionDate'] = '$NOW'
                  app['size'] = int('$MOVIES_SIZE')
                  app['downloadURL'] = f'https://github.com/Apnkk/Z-Flix-iOS-Releases/releases/download/$MOVIES_TAG/Z-Movies.ipa'
              elif app.get('name') == 'Z-Animes':
                  app['version'] = '$ANIMES_VER'
                  app['versionDate'] = '$NOW'
                  app['size'] = int('$ANIMES_SIZE')
                  app['downloadURL'] = f'https://github.com/Apnkk/Z-Flix-iOS-Releases/releases/download/$ANIMES_TAG/Z-Animes.ipa'

          with open('feather.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          git config user.name "Apnkk"
          git config user.email "apnkk@users.noreply.github.com"
          git add feather.json
          git commit -m "chore: update feather.json with new IPA builds" || true
          git push origin main || true
